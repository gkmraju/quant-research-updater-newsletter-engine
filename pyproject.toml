[project]
name = "quantnews-updater"
version = "0.1.0"
description = "Quant research monitor and newsletter generator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
authors = [
    { name = "RAJU" }
]
keywords = ["quant", "arxiv", "newsletter", "research", "digest"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

[project.scripts]
quantnews-update = "quant_update_bot.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_update_bot*"]
