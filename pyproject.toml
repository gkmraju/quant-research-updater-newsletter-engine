[project]
name = "quantnews-updater"
version = "0.1.0"
description = "Quant research monitor and newsletter generator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "jinja2>=3.1",
]

authors = [
    { name = "RAJU" }
]
keywords = ["quant", "arxiv", "newsletter", "research", "digest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<1",
]

[project.scripts]
quantnews-update = "quant_update_bot.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_update_bot*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
