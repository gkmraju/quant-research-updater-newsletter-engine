name: Daily QuantNews Telegram PDF

on:
  workflow_dispatch:
    inputs:
      include_seen:
        description: Include recently seen papers
        required: false
        default: "false"
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: read

jobs:
  build-and-deliver:
    runs-on: windows-latest
    concurrency:
      group: quantnews-daily-pdf
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate and send digest
        shell: bash
        env:
          QUANTNEWS_TELEGRAM_BOT_TOKEN: ${{ secrets.QUANTNEWS_TELEGRAM_BOT_TOKEN }}
          QUANTNEWS_TELEGRAM_CHAT_ID: ${{ secrets.QUANTNEWS_TELEGRAM_CHAT_ID }}
        run: |
          args=(--config config.example.json --deliver telegram --publication both)
          if [[ "${{ inputs.include_seen || 'false' }}" == "true" ]]; then
            args+=(--include-seen)
          fi
          python -m quant_update_bot.main "${args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantnews-digest
          path: |
            output/latest_digest.md
            output/latest_digest.html
            output/latest_digest.pdf
          if-no-files-found: error
