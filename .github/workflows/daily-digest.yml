name: Daily Digest

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  build-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate digest
        run: |
          python -m quant_update_bot.main --config config.example.json --output output/latest_digest.md

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantnews-digest
          path: output/latest_digest.md
